apiVersion: 1
datasources:
  - name: Parking InfluxDB
    uid: parking-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: parking
      defaultBucket: sensor_data
    secureJsonData:
      token: $INFLUX_READ_TOKEN
